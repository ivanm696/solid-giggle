# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# This simplified template uses the supported language matrix and the
# recommended CodeQL action steps (init, autobuild, analyze). If your
# repository requires a custom build (compiled languages or special
# dependency installation), add build steps guarded by `if: matrix.build == 'manual'`.

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '44 0 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python', 'actions' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    # Autobuild attempts to build the project where appropriate. For many
    # repositories this is sufficient; if your project needs explicit build
    # or dependency installation steps (for example Python requirements or
    # a JS build step), add them before the `analyze` step.
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    # If your repository requires a manual build step, you can add a step like
    # the example below and guard it with `if: matrix.build == 'manual'`.
    # - name: Manual build (example)
    #   if: matrix.build == 'manual'
    #   run: |
    #     echo "Add commands to build your project here"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

name = "giggle-engine"
main = "src/index.ts"
compatibility_date = "2024-05-01"

# Секция для активации Cloudflare Workflows
[[workflows]]
name = "giggle-engine-workflow"
binding = "MY_WORKFLOW"      # Имя переменной в коде (env.MY_WORKFLOW)
class_name = "MyWorkflow"    # Должно в точности совпадать с именем класса в index.ts

[vars]
ENVIRONMENT = "production"
